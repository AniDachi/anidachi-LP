name = "anidachi-api"
main = "src/index.ts"
compatibility_date = "2026-05-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ANIDACHI_ENV = "local"
ANIDACHI_WEB_INTERNAL_BASE_URL = "http://localhost:3003"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[[analytics_engine_datasets]]
binding = "ROOM_ANALYTICS"
dataset = "anidachi_room_events"

[env.staging]
name = "anidachi-api-staging"
workers_dev = true

[env.staging.vars]
ANIDACHI_ENV = "staging"
ANIDACHI_WEB_INTERNAL_BASE_URL = "https://staging.anidachi.app"

[env.staging.triggers]
# Invitation recovery now runs from staging Supabase Cron; retain the Worker
# handler for explicit rollback, without a second active staging timer.
crons = []

[[env.staging.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[env.staging.analytics_engine_datasets]]
binding = "ROOM_ANALYTICS"
dataset = "anidachi_room_events_staging"

[env.production]
name = "anidachi-api-production"
workers_dev = true

[env.production.vars]
ANIDACHI_ENV = "production"
ANIDACHI_WEB_INTERNAL_BASE_URL = "https://www.anidachi.app"

[env.production.triggers]
crons = ["* * * * *"]

[[env.production.durable_objects.bindings]]
name = "ROOMS"
class_name = "RoomDurableObject"

[[env.production.analytics_engine_datasets]]
binding = "ROOM_ANALYTICS"
dataset = "anidachi_room_events_production"
