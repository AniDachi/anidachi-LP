name: Sync released main to staging
on:
  push:
    branches: [staging]
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions: {}
concurrency:
  group: sync-released-main
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether released files need a staging PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-released-main.py
