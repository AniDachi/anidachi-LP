name: Sync released main to staging
on:
  push:
    branches: [main, staging]

permissions: {}
concurrency:
  group: sync-released-main
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      needed: ${{ steps.sync.outputs.needed }}
      number: ${{ steps.sync.outputs.number }}
      merge: ${{ steps.sync.outputs.merge }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync-released-main.py plan

  verify:
    needs: plan
    if: needs.plan.outputs.needed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      candidate_sha: ${{ needs.plan.outputs.merge }}

  merge-staging:
    needs: [plan, verify]
    if: needs.plan.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          SYNC_PR: ${{ needs.plan.outputs.number }}
          TESTED_MERGE: ${{ needs.plan.outputs.merge }}
        run: python3 scripts/sync-released-main.py finish
