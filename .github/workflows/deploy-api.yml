name: Deploy API

on:
  workflow_dispatch:
    inputs:
      production_ready_sha:
        description: "Full main commit SHA whose production schema and compatible Web were verified (production only)"
        type: string
        required: false
  push:
    branches:
      - staging
    paths:
      - "apps/api/**"
      - "packages/protocol/**"
      - "pnpm-lock.yaml"
      - "scripts/worker-deploy-gate*"
      - ".github/workflows/deploy-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging' || (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Validate deployment authorization
        env:
          CONFIRMED_PRODUCTION_SHA: ${{ inputs.production_ready_sha }}
        run: node scripts/worker-deploy-gate.mjs

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API
        run: pnpm --filter @anidachi/api check

      - name: Test API
        run: pnpm --filter @anidachi/api test

      - name: Test API Workers runtime
        run: pnpm --filter @anidachi/api test:runtime

      - name: Dry-run Worker deploy
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env "$DEPLOY_ENV" --dry-run --outdir /tmp/anidachi-worker-dry-run

      - name: Deploy Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env "$DEPLOY_ENV"
