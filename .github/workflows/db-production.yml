name: Deploy migrations to production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Production
      # Vercel owns the web deployment record for this environment.
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0
      - name: Preview and apply production migrations
        env:
          SUPABASE_MIGRATIONS_TOKEN: ${{ secrets.SUPABASE_MIGRATIONS_TOKEN }}
        run: python3 scripts/deploy_db_migrations.py
