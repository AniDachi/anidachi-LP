name: Production database transition hold

# No secret-bearing apply job until a separately reviewed production unlock.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-history-transition
  cancel-in-progress: false
jobs:
  production-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse uncoordinated production migration
        run: |
          echo 'Production is held. See docs/releases/personal-history-mvp/production-35-to-60-transition.md.'
          echo 'Unlock requires deployed-inert, maintenance, backup/restore and matching rehearsal evidence.'
          exit 1
