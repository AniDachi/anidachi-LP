name: Deploy migrations to staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.111.0
      - name: Preview and apply staging migrations
        env:
          PGSSLROOTCERT: ${{ github.workspace }}/.github/supabase-db-ca.crt
          PGPASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          DB_URL: postgresql://postgres.cyppqpprkygjloyfvvvj@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=verify-full
        run: |
          : "${PGPASSWORD:?Set the staging database password}"
          supabase --workdir apps/web db push --db-url "$DB_URL" --dry-run
          supabase --workdir apps/web db push --db-url "$DB_URL"
