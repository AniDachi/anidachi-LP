name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      candidate_sha:
        type: string
        required: true
      media:
        type: boolean
        default: false
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.candidate_sha || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.2.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Test production Worker deployment gate
        run: node --test scripts/worker-deploy-gate.test.mjs

      - name: Test API Workers runtime
        run: pnpm --filter @anidachi/api test:runtime

      - name: Lint web (matches Vercel build lint gate)
        run: pnpm --filter @anidachi/web lint

      - name: Check Worker bundle
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env staging --dry-run --outdir /tmp/anidachi-worker-dry-run

      - name: Verify room and two-browser media compatibility
        if: inputs.media
        run: |
          pnpm harness:rooms
          npm --prefix tests/e2e install
          npm --prefix tests/e2e exec -- playwright install --with-deps chromium
          npm --prefix tests/e2e run harness:p2p
